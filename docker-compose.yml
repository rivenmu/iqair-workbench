services:
  # ============ MySQL 数据库 ============
  mysql:
    image: mysql:8.0
    container_name: iqair-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iqair_workbench}
      MYSQL_USER: ${MYSQL_USER:-iqair}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-iqairpassword123}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./data/logs/mysql:/var/log/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - iqair-network

  # ============ Redis 缓存 & Celery Broker ============
  redis:
    image: redis:7-alpine
    container_name: iqair-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword123}
    networks:
      - iqair-network

  # ============ Django 后端 ============
  backend:
    build: ./backend
    container_name: iqair-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-iqair_workbench}
      DATABASE_USER: ${MYSQL_USER:-iqair}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-iqairpassword123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
      SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-to-a-random-secret-key-in-production}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      SNAPSHOTS_DIR: /app/data/snapshots
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data/snapshots:/app/data/snapshots
      - ./data/logs/backend:/app/logs
    working_dir: /app/backend
    command: >
      sh -c "mkdir -p /app/logs &&
             python manage.py migrate &&
             python manage.py init_admin &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - iqair-network

  # ============ Celery Worker (异步任务) ============
  celery-worker:
    build: ./backend
    container_name: iqair-celery-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-iqair_workbench}
      DATABASE_USER: ${MYSQL_USER:-iqair}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-iqairpassword123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
      SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-to-a-random-secret-key-in-production}
      SNAPSHOTS_DIR: /app/data/snapshots
    volumes:
      - ./backend:/app/backend
      - ./data/snapshots:/app/data/snapshots
      - ./data/logs/backend:/app/logs
    working_dir: /app/backend
    command: sh -c "mkdir -p /app/logs && celery -A config worker -l info --concurrency=2"
    networks:
      - iqair-network

  # ============ Celery Beat (定时任务) ============
  celery-beat:
    build: ./backend
    container_name: iqair-celery-beat
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-iqair_workbench}
      DATABASE_USER: ${MYSQL_USER:-iqair}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-iqairpassword123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
      SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-to-a-random-secret-key-in-production}
      SNAPSHOTS_DIR: /app/data/snapshots
    volumes:
      - ./backend:/app/backend
      - ./data/snapshots:/app/data/snapshots
      - ./data/logs/backend:/app/logs
    working_dir: /app/backend
    command: sh -c "mkdir -p /app/logs && celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    networks:
      - iqair-network

  # ============ Vue 前端 (Vite 开发服务器) ============
  frontend:
    build: ./frontend
    container_name: iqair-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://10.0.0.6:8000
      VITE_APP_TITLE: IQAir 数据分析工作台
    ports:
      # 主访问端口：10.0.0.6:8888
      - "8888:8888"
    volumes:
      # 核心热更新挂载：前端代码（保存即生效，Vite HMR）
      - ./frontend:/app/frontend
      # 保留 node_modules 在容器内，避免 Windows/Linux 文件系统差异
      - /app/frontend/node_modules
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8888"
    networks:
      - iqair-network

networks:
  iqair-network:
    driver: bridge
