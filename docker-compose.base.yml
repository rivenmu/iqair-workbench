services:
  mysql:
    image: mysql:8.0
    container_name: iqair-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iqair_workbench}
      MYSQL_USER: ${MYSQL_USER:-iqair}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./data/logs/mysql:/var/log/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - iqair-network

  redis:
    image: redis:7-alpine
    container_name: iqair-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - iqair-network

  backend:
    build: ./backend
    container_name: iqair-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-iqair_workbench}
      DATABASE_USER: ${MYSQL_USER:-iqair}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8888}
      SNAPSHOTS_DIR: /app/data/snapshots
    ports:
      - "8000:8000"
    volumes:
      - ./data/snapshots:/app/data/snapshots
      - ./data/logs/backend:/app/logs
    working_dir: /app/backend
    networks:
      - iqair-network

  celery-worker:
    build: ./backend
    container_name: iqair-celery-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-iqair_workbench}
      DATABASE_USER: ${MYSQL_USER:-iqair}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      SNAPSHOTS_DIR: /app/data/snapshots
    volumes:
      - ./data/snapshots:/app/data/snapshots
      - ./data/logs/backend:/app/logs
    working_dir: /app/backend
    command: sh -c "mkdir -p /app/logs && celery -A config worker -l info --concurrency=${CELERY_WORKERS:-2}"
    networks:
      - iqair-network

  celery-beat:
    build: ./backend
    container_name: iqair-celery-beat
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-iqair_workbench}
      DATABASE_USER: ${MYSQL_USER:-iqair}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      SNAPSHOTS_DIR: /app/data/snapshots
    volumes:
      - ./data/snapshots:/app/data/snapshots
      - ./data/logs/backend:/app/logs
    working_dir: /app/backend
    command: sh -c "mkdir -p /app/logs && celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    networks:
      - iqair-network

  frontend:
    build: ./frontend
    container_name: iqair-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-IQAir 数据分析工作台}
    ports:
      - "8888:8888"
    networks:
      - iqair-network

networks:
  iqair-network:
    driver: bridge