services:
  mysql:
    image: mysql:8.0
    container_name: iqair-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./data/logs/mysql:/var/log/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - iqair-network

  redis:
    image: redis:7-alpine
    container_name: iqair-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - iqair-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iqair-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      SNAPSHOTS_DIR: /app/data/snapshots
    ports:
      - "8000:8000"
    volumes:
      - ./data/snapshots:/app/data/snapshots
      - ./data/logs/backend:/app/logs
      - ./uploadfiles:/app/uploadfiles
    working_dir: /app/backend
    command: >
      sh -c "mkdir -p /app/logs &&
             python manage.py migrate &&
             python manage.py init_admin &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile /app/logs/gunicorn_access.log --error-logfile /app/logs/gunicorn_error.log"
    networks:
      - iqair-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iqair-celery-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      SNAPSHOTS_DIR: /app/data/snapshots
    volumes:
      - ./data/snapshots:/app/data/snapshots
      - ./data/logs/backend:/app/logs
    working_dir: /app/backend
    command: sh -c "mkdir -p /app/logs && celery -A config worker -l info --concurrency=4"
    networks:
      - iqair-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iqair-celery-beat
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      SNAPSHOTS_DIR: /app/data/snapshots
    volumes:
      - ./data/snapshots:/app/data/snapshots
      - ./data/logs/backend:/app/logs
    working_dir: /app/backend
    command: sh -c "mkdir -p /app/logs && celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    networks:
      - iqair-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: iqair-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_APP_TITLE: ${VITE_APP_TITLE}
    ports:
      - "8888:80"
    networks:
      - iqair-network

networks:
  iqair-network:
    driver: bridge
